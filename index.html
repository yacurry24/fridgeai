<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FridgeGenius</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode"
    <header>
        <h1>FridgeGenius</h1>
        <button class="button">Login/Signup</button>
        <button id="darkModeButton">Dark Mode</button>

    </header>
    <div id="userPoints">0</div>
        <div id="ingredientsList"></div>
    <input type="text" id="ingredientName" placeholder="Ingredient name">
    <input type="number" id="ingredientQuantity" placeholder="Quantity" value="1">
    <input type="text" id="ingredientUnit" placeholder="Unit">
    <input type="date" id="ingredientExpiration">
    <button id="addIngredientButton">Add</button>
    <div id="recipes"></div>
    <script src="script.js"></script>
</body>
</html>
